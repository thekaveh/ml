name: CI
run-name: "CI / ${{ github.event_name }} / ${{ github.event.action || 'none' }} / PR ${{ github.event.pull_request.number || 0 }}"

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # Weekly smoke of Tier-B/C papermill targets, surfaces env drift early.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  atlas-consumer-policy:
    name: atlas-consumer-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            requirements/locks/atlas-contract.txt
            requirements.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in

      - name: Install focused Atlas contract dependencies
        run: |
          make install-bootstrap
          make install-atlas-contract-lock
          python -m pip check

      - name: ShellCheck parent-owned Atlas wrappers
        run: shellcheck scripts/atlas-up.sh scripts/atlas-down.sh scripts/atlas-connect.sh scripts/lib/atlas-dotenv.sh

      - name: Run Atlas consumer policy tests
        run: make test-atlas-consumer

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            requirements/locks/compiler.txt
            requirements/locks/audit.txt
            requirements/locks/atlas-contract.txt
            requirements/locks/darwin-arm64/core.txt
            requirements/locks/darwin-arm64/runtime.txt
            requirements/locks/darwin-arm64/root.txt
            requirements/locks/linux-x86_64/core.txt
            requirements/locks/linux-x86_64/runtime.txt
            requirements/locks/linux-x86_64/root.txt
            requirements/locks/linux-aarch64/core.txt
            requirements/locks/linux-aarch64/runtime.txt
            requirements/locks/linux-aarch64/root.txt
            requirements.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in
            docs-requirements.txt

      - name: Install locked audit environment
        run: |
          make install-bootstrap
          make install-audit-lock
          python -m pip check

      - name: Verify committed dependency locks offline
        run: make verify-dependency-locks

      - name: Compare dependency advisories with accepted baseline
        run: make audit-advisories

      - name: Select networked dependency checks
        id: dependency-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m scripts.verify_dependency_locks \
            --classify-event "${{ github.event_name }}" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install locked compiler
        if: steps.dependency-scope.outputs.lock-check == 'true'
        run: |
          make install-compiler-lock
          python -m pip check

      - name: Regenerate and compare dependency locks
        if: steps.dependency-scope.outputs.lock-check == 'true'
        run: make lock-check

      - name: Validate immutable image identities
        if: steps.dependency-scope.outputs.image-check == 'true'
        run: make image-lock-check

  pytest-repository:
    name: pytest-repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install system dependencies for cairosvg
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            requirements/locks/linux-x86_64/core.txt
            requirements/locks/linux-x86_64/runtime.txt
            requirements/locks/linux-x86_64/root.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in
            docs-requirements.txt

      - name: Install dependencies
        # Issue #63: the root lock already includes docs; no duplicate resolver pass.
        run: make install-torch-stack

      - name: Check and verify canonical Torch and NNx stack
        run: |
          python -m pip check
          make verify-torch-stack
          make verify-nnx-install

      - name: Run complete repository tests
        run: make test

  pytest-nnx-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            requirements/locks/linux-x86_64/core.txt
            requirements/locks/linux-x86_64/runtime.txt
            requirements/locks/linux-x86_64/root.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in
            docs-requirements.txt

      - name: Install dependencies
        run: make install-torch-stack

      - name: Lint (ruff check)
        run: make lint

      - name: Check and verify canonical Torch and NNx stack
        run: |
          python -m pip check
          make verify-torch-stack
          make verify-nnx-install

      - name: Run NNx-surface tests
        run: |
          pytest -p no:cacheprovider -W error --junitxml=/tmp/nnx-surface.xml tests/nnx_surface -v
          python -m scripts.verify_junit /tmp/nnx-surface.xml

  verify-repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            requirements/locks/linux-x86_64/core.txt
            requirements/locks/linux-x86_64/runtime.txt
            requirements/locks/linux-x86_64/root.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in
            docs-requirements.txt

      - name: Install dependencies
        run: make install-torch-stack

      - name: Check and verify canonical Torch and NNx stack
        run: |
          python -m pip check
          make verify-torch-stack
          make verify-nnx-install

      - name: Test repository workflow contracts
        run: |
          pytest tests/test_verify_repo.py::test_ci_repository_test_contract_enforces_canonical_nnx_wheel tests/test_verify_repo.py::test_ci_nnx_surface_job_enforces_canonical_wheel_contract tests/test_verify_repo.py::test_ci_dependency_audit_job_contract -q
          pytest tests/test_verify_repo.py -q -k 'atlas_consumer_policy_contract or atlas_contract_workflow or dependency_audit or atlas_docs_preserve_mounted_workspace_and_track_ownership or ci_covers_gitflow_pr_targets or ci_tier_a_uses_temporary_outputs_and_preserves_sources or documentation_workflows_install_cairo_and_gate_pages_inputs or documentation_direct_dependencies_are_exactly_pinned or docs_workflow_covers_atlas_metadata_inputs_and_parser_tests or ci_verify_repo_submodule_contract or ci_runs_repository_workflow_contract_tests or ci_runs_complete_repository_test_contract or ci_repository_test_contract_enforces_canonical_nnx_wheel or ci_nnx_surface_job_enforces_canonical_wheel_contract or repository_test_collection_boundary_is_explicit'

      - name: Run repo verifier
        run: make verify

  docs-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install system dependencies for cairosvg
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            docs-requirements.txt
            requirements.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in

      - name: Install documentation dependencies
        run: |
          make install-bootstrap
          make install-docs-lock
          python -m pip check

      - name: Build documentation site
        run: make docs-build

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t ml-eng-lab-ci .

  tier-a-papermill:
    runs-on: ubuntu-24.04
    # 18 Tier-A notebooks (mnist-pytorch moved to Tier-B per issue #7; reddit
    # phase1 moved to Tier-B after the 2026-07-04 CI run showed its fresh
    # Google Drive Reddit2 download is too fragile for every-PR gating;
    # quantization-mnist-pytorch originally moved to Tier-B per issue #10, was
    # removed on 2026-06-16, and returns to Tier-B under Issue #66 after complete
    # canonical PTQ/QAT and checkpoint qualification. Cumulative
    # ~7 min on a macOS M-series CPU but Linux
    # GH Actions runners are ~3-4× slower for hand-coded numpy training
    # (image_classification-mnist-ffnn-numpy is the worst offender — observed
    # ~30 min on its own at PR-#5 HEAD edcab84). 90 min cap leaves headroom
    # for the heaviest notebook while still failing fast vs GH's default 6 h.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            requirements/locks/linux-x86_64/core.txt
            requirements/locks/linux-x86_64/runtime.txt
            requirements/locks/linux-x86_64/root.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in
            docs-requirements.txt

      - name: Install dependencies
        run: |
          make install-torch-stack
          make nlp-assets
          make verify-nlp-assets

      - name: Check and verify canonical Torch and NNx stack
        run: |
          python -m pip check
          make verify-torch-stack
          make verify-nnx-install

      - name: Run Tier-A notebooks (papermill)
        run: make smoke-tier-a

      - name: Verify Tier-A notebook output contract
        run: python -m scripts.verify_smoke_outputs --tier a --root /tmp/ml-tier-a

      - name: Check Tier-A temporary notebook outputs
        run: make check-tier-a-artifacts

      - name: Check Tier-A source notebooks are unchanged
        run: make check-tier-a-clean

      - name: Upload refreshed notebook outputs as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tier-a-notebooks
          # All 18 Tier-A notebooks; quantization is covered separately by Tier-B's semantic output contract.
          path: |
            /tmp/ml-tier-a/notebooks/image_classification-mnist-ffnn-numpy/notebook.ipynb
            /tmp/ml-tier-a/notebooks/tabular_classification-iris-mlp-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/model_surgery-mnist-ffnn-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/pruning-mnist-ffnn-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/knowledge_distillation-mnist-ffnn-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/text_generation-tinyshakespeare-transformer-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/peft-mnist-to-fmnist-dora-vs-lora-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/dim_reduction-iris-autoencoder-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/tabular_regression-diabetes-mlp-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/diffusion-mnist-ddpm-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/moe-fmnist-mixture-of-experts-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/clustering-iris-kmeans-vs-ae-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/link_prediction-karate-graphsage-pyg/notebook.ipynb
            /tmp/ml-tier-a/notebooks/community_detection-karate-louvain-vs-gnn-pyg/notebook.ipynb
            /tmp/ml-tier-a/notebooks/text_classification-agnews-spacy-mlp-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/sentiment_classification-vader-mlp-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/preference_alignment-toy-dpo-pytorch/notebook.ipynb
            /tmp/ml-tier-a/notebooks/self_supervised-fmnist-jepa-pytorch/notebook.ipynb
          retention-days: 7
          if-no-files-found: error

  smoke-tier-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: |
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || contains(github.event.pull_request.labels.*.name, 'tier-b-smoke')
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            requirements/locks/linux-x86_64/core.txt
            requirements/locks/linux-x86_64/runtime.txt
            requirements/locks/linux-x86_64/root.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in
            docs-requirements.txt

      - name: Install dependencies
        run: make install-torch-stack

      - name: Check and verify canonical Torch and NNx stack
        run: |
          python -m pip check
          make verify-torch-stack
          make verify-nnx-install

      - name: Smoke-run Tier-B notebooks
        run: make smoke-tier-b

      - name: Verify Tier-B notebook output contract
        run: python -m scripts.verify_smoke_outputs --tier b --root /tmp/ml-smoke

  smoke-tier-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            requirements/locks/linux-x86_64/core.txt
            requirements/locks/linux-x86_64/runtime.txt
            requirements/locks/linux-x86_64/root.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in
            docs-requirements.txt

      - name: Install dependencies
        run: make install-torch-stack

      - name: Check and verify canonical Torch and NNx stack
        run: |
          python -m pip check
          make verify-torch-stack
          make verify-nnx-install

      - name: Smoke-run Tier-C notebooks
        run: make smoke-tier-c

      - name: Verify Tier-C notebook output contract
        run: python -m scripts.verify_smoke_outputs --tier c --root /tmp/ml-smoke
