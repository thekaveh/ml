name: Docs gate

on:
  pull_request:
    paths:
      - '*.md'
      - 'docs/**'
      - 'docs/manifest.yaml'
      - 'notebooks/**/README.md'
      - 'notebooks/**/docs/spec.yaml'
      - 'mkdocs.yml'
      - '.gitmodules'
      - 'infra'
      - 'atlas.consumer.yml'
      - 'atlas.env.user.example'
      - 'compose/**'
      - 'scripts/atlas-*.sh'
      - 'scripts/lib/atlas-dotenv.sh'
      - 'scripts/docs/**'
      - 'scripts/docs/notebook_infrastructure.py'
      - 'tests/test_notebook_infrastructure.py'
      - 'tests/test_build_docs.py'
      - 'tests/test_check_docs.py'
      - 'tests/test_manifest.py'
      - 'tests/test_render_diagrams.py'
      - 'tests/test_transforms.py'
      - 'tests/test_wiki.py'
      - 'security/accepted-advisories.json'
      - 'vulnerability-audit-requirements.txt'
      - 'torch-audit-requirements.txt'
      - 'pyg-extension-audit-requirements.txt'
      - 'scripts/advisory_baseline.py'
      - 'tests/test_advisory_baseline.py'
      - 'docs-requirements.in'
      - 'docs-requirements.txt'
      - 'bootstrap-requirements.txt'
      - 'requirements/lock-policy.toml'
      - 'requirements/locks/bootstrap.txt'
      - 'scripts/install_locked_requirements.py'
      - 'scripts/verify_dependency_locks.py'
      - 'Makefile'
      - '.github/workflows/docs.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install system dependencies for cairosvg
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/lock-policy.toml
            requirements/locks/bootstrap.txt
            docs-requirements.txt
            requirements.txt
            bootstrap-requirements.txt
            compiler-requirements.txt
            nlp-model-requirements.txt
            torch-core-requirements.txt
            torch-ecosystem-requirements.txt
            torch-requirements.txt
            torch-audit-requirements.txt
            pyg-extension-audit-requirements.txt
            vulnerability-audit-requirements.txt
            atlas-contract-requirements.txt
            docs-requirements.in

      - name: Install documentation dependencies
        run: |
          make install-bootstrap
          make install-docs-lock
          python -m pip check

      - name: Render diagrams + generate + gate
        run: make docs-check

      - name: Lint docs scripts
        run: ruff check scripts/docs/

      - name: Unit tests (docs scripts)
        run: pytest tests/test_manifest.py tests/test_notebook_infrastructure.py tests/test_links.py tests/test_transforms.py tests/test_render_diagrams.py tests/test_build_docs.py tests/test_wiki.py tests/test_check_docs.py tests/test_push_wiki.py -v
